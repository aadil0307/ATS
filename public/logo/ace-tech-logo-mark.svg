<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26d9f0"/>
      <stop offset="55%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#8b3ff5"/>
    </linearGradient>

    <linearGradient id="gHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26d9f0">
        <animate attributeName="stop-color" values="#26d9f0;#6c5ce7;#8b3ff5;#6c5ce7;#26d9f0" dur="9s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b3ff5">
        <animate attributeName="stop-color" values="#8b3ff5;#8b3ff5;#26d9f0;#6c5ce7;#8b3ff5" dur="9s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="textShine" x1="-40%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#26d9f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8b3ff5"/>
      <animate attributeName="x1" values="-40%;140%" dur="4.5s" calcMode="spline" keySplines="0.4 0 0.2 1" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;180%" dur="4.5s" calcMode="spline" keySplines="0.4 0 0.2 1" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#26d9f0" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#26d9f0" stop-opacity="0"/>
    </radialGradient>

    <path id="spadePath" d="M60,14
           C 32,40 16,60 25,77
           C 32,90 50,89 58,77
           C 60,84 56,90 48,96
           C 43,100 40,104 40,109
           L 80,109
           C 80,104 77,100 72,96
           C 64,90 60,84 62,77
           C 70,89 88,90 95,77
           C 104,60 88,40 60,14 Z"/>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#050810" flood-opacity="0.65"/>
    </filter>
  </defs>

  <circle cx="60" cy="62" r="52" fill="url(#glow)">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="5s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.5">
    <g stroke="url(#gHex)" stroke-width="0.9" opacity="0.8">
      <line x1="60" y1="61" x2="60" y2="22"/>
      <line x1="60" y1="61" x2="94" y2="41"/>
      <line x1="60" y1="61" x2="94" y2="81"/>
      <line x1="60" y1="61" x2="60" y2="100"/>
      <line x1="60" y1="61" x2="26" y2="81"/>
      <line x1="60" y1="61" x2="26" y2="41"/>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 60 61" to="360 60 61" dur="36s" repeatCount="indefinite"/>
    </g>
    <g stroke="url(#gHex)" stroke-width="0.7" fill="none" opacity="0.45">
      <polygon points="60,22 94,41 94,81 60,100 26,81 26,41"/>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360 60 61" to="0 60 61" dur="48s" repeatCount="indefinite"/>
    </g>
    <g fill="url(#gHex)">
      <circle cx="60" cy="22" r="2.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="0s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/></circle>
      <circle cx="94" cy="41" r="2.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="0.5s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/></circle>
      <circle cx="94" cy="81" r="2.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="100" r="2.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1.5s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/></circle>
      <circle cx="26" cy="81" r="2.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="2s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/></circle>
      <circle cx="26" cy="41" r="2.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="2.5s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <use href="#spadePath" fill="url(#g)" opacity="0.15"/>
  <use href="#spadePath" fill="none" stroke="url(#g)" stroke-width="2" stroke-linejoin="round"/>

  <use href="#spadePath" fill="none" stroke="#eaffff" stroke-width="2.2" stroke-linejoin="round"
       stroke-dasharray="16 332" stroke-dashoffset="0" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="348" to="0" dur="4s" calcMode="spline" keySplines="0.4 0 0.2 1" repeatCount="indefinite"/>
  </use>

  <circle cx="60" cy="14" r="6.5" fill="none" stroke="url(#g)" stroke-width="0.9" opacity="0.45"/>

  <circle r="2" fill="#eaffff">
    <animateMotion dur="6s" repeatCount="indefinite" path="M60,7.5 A6.5,6.5 0 1,1 59.9,7.5 Z"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
  </circle>

  <text x="60" y="49" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="16.5" fill="url(#textShine)" letter-spacing="1.6" filter="url(#softShadow)">ACE</text>
  <text x="60" y="65" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-weight="700"
        font-size="6.8" fill="url(#gHex)" letter-spacing="1" filter="url(#softShadow)">TECH SOLUTIONS</text>
</svg>
